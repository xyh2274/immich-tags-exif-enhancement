# [CUSTOM] 原值 -Xmx4096M 在本机 31.9GB 内存下偏小，release 构建时
# Kotlin/KSP 编译器易触发频繁 GC 导致假死（CPU 停止增长、日志无输出）。
org.gradle.jvmargs=-Xmx8192M -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
org.gradle.caching=true
org.gradle.parallel=true
# [CUSTOM] 第三方插件（如 fluttertoast）内部的 Java/Kotlin target 不一致
# （Java 11 vs Kotlin 17），新版 Gradle 会视为致命错误。降级为告警以放行。
kotlin.jvm.target.validation.mode=warning
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
